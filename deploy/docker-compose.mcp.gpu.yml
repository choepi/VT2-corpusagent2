## Optional GPU overlay for deploy/docker-compose.yml + deploy/docker-compose.mcp.yml.
## Use only on hosts with NVIDIA Container Toolkit installed and CDI configured.
## If you see "failed to discover GPU vendor from CDI: no known GPU vendor found",
## run:  sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
## then restart the Docker daemon before using this overlay.
services:
  corpusagent2-api:
    build:
      args:
        CORPUSAGENT2_DOCKER_TORCH_PROFILE: ${CORPUSAGENT2_DOCKER_TORCH_PROFILE:-cuda}
        CORPUSAGENT2_DOCKER_INSTALL_NLP_PROVIDERS: ${CORPUSAGENT2_DOCKER_INSTALL_NLP_PROVIDERS:-true}
    environment:
      CORPUSAGENT2_DEVICE: ${CORPUSAGENT2_DEVICE:-cuda}
    gpus: all

  corpusagent2-mcp:
    build:
      args:
        CORPUSAGENT2_DOCKER_TORCH_PROFILE: ${CORPUSAGENT2_DOCKER_TORCH_PROFILE:-cuda}
        CORPUSAGENT2_DOCKER_INSTALL_NLP_PROVIDERS: ${CORPUSAGENT2_DOCKER_INSTALL_NLP_PROVIDERS:-true}
    environment:
      CORPUSAGENT2_DEVICE: ${CORPUSAGENT2_DEVICE:-cuda}
    gpus: all
